apiVersion: sos.sos.exoscale.ch/v1alpha1
kind: BucketVersioning
metadata:
  annotations:
    meta.upbound.io/example-id: sos/v1alpha1/bucketversioning
  labels:
    testing.upbound.io/example-name: versioning_example
  name: versioning-example
spec:
  forProvider:
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    versioningConfiguration:
    - status: Enabled

---

apiVersion: sos.sos.exoscale.ch/v1alpha1
kind: Bucket
metadata:
  annotations:
    meta.upbound.io/example-id: sos/v1alpha1/bucketversioning
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider: {}

---

apiVersion: sos.sos.exoscale.ch/v1alpha1
kind: BucketACL
metadata:
  annotations:
    meta.upbound.io/example-id: sos/v1alpha1/bucketversioning
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    acl: private
    bucketSelector:
      matchLabels:
        testing.upbound.io/example-name: example
